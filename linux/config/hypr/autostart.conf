# Start Listeners
# Disabled: only gtk-theme-switcher (Caelestia themes now) + low-bat (desktop, no battery) (2026-07-05)
# exec-once=~/.config/ml4w/listeners.sh --startall

# Start Polkit
exec-once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Start GNOME Keyring (for browser password storage)
exec-once = gnome-keyring-daemon --start --components=secrets

# Restore Wallpaper
# Migrated to Caelestia (it renders + restores wallpaper itself: `caelestia wallpaper -f <img>`) (2026-07-05)
# exec-once = ~/.config/ml4w/scripts/ml4w-wallpaper-app --restore

# Autostart script
# Disabled: launched ML4W's quickshell instances (bar backend, settings, overview,
# welcome) - all replaced by Caelestia. Wallpaper now via caelestia. (2026-07-05)
# exec-once = ~/.config/ml4w/scripts/ml4w-autostart

# Load GTK settings
exec-once = ~/.config/hypr/scripts/gtk.sh

# Load Notification Daemon
# Migrated to Caelestia's built-in notification server (2026-07-05)
# exec-once = swaync

# Using hypridle to start hyprlock
exec-once = hypridle

# Load cliphist history
exec-once = wl-paste --watch cliphist store

# Start autostart cleanup
exec-once = ~/.config/hypr/scripts/cleanup.sh

# Load configuration from ML4W Hyprland Settings App
exec = ~/.config/com.ml4w.hyprlandsettings/hyprctl.sh
