# Add your additional Hyprland configurations here

# Custom gaps (overrides window style defaults)
general {
    gaps_in = 2
    gaps_out = 0
}

# Remap app launcher from Super+Ctrl+Enter to Super+Space
# Now opens Caelestia's launcher (was ~/.config/hypr/scripts/launcher.sh = Walker/Rofi)
unbind = SUPER CTRL, RETURN
bind = SUPER, SPACE, exec, caelestia shell drawers toggle launcher

# Screenshots estilo macOS (hyprshot guarda en ~/Pictures y copia al portapapeles)
# Super+Shift+3 -> pantalla (monitor) completa
# Super+Shift+4 -> seleccionar una region
# Super+Shift+5 -> ventana activa
unbind = SUPER SHIFT, 3
unbind = SUPER SHIFT, 4
unbind = SUPER SHIFT, 5
bind = SUPER SHIFT, 3, exec, hyprshot -m output
bind = SUPER SHIFT, 4, exec, hyprshot -m region
bind = SUPER SHIFT, 5, exec, hyprshot -m window

# Reubico "mover ventana a workspace" 3/4/5 (liberados arriba) a Super+Alt
bind = SUPER ALT, 3, movetoworkspace, 3
bind = SUPER ALT, 4, movetoworkspace, 4
bind = SUPER ALT, 5, movetoworkspace, 5
unbind = SUPER SHIFT, 6
bind = SUPER ALT, 6, movetoworkspace, 6

# Grabacion de pantalla (toggle: pulsar para iniciar / detener) -> guarda en ~/Videos
# Super+Shift+6        -> grabar una region
# Super+Ctrl+Shift+6   -> grabar pantalla completa
# (anade "audio" como 2do argumento si quieres incluir sonido)
bind = SUPER SHIFT, 6, exec, ~/.config/hypr/scripts/screenrecord.sh region
bind = SUPER CTRL SHIFT, 6, exec, ~/.config/hypr/scripts/screenrecord.sh full

# Energia
# Super+Shift+- (minus) -> suspender
# Super+Shift+= (equal) -> apagar
bind = SUPER SHIFT, minus, exec, systemctl suspend
# Migrated to Caelestia session drawer (power menu: lock/suspend/reboot/shutdown).
# Was ~/.config/hypr/scripts/confirm-poweroff.sh (rofi). (2026-07-05)
bind = SUPER SHIFT, equal, exec, caelestia shell drawers toggle session

# Alt+Tab cicla entre workspaces (como escritorios en Win/Mac)
# Alt+Tab -> siguiente workspace | Alt+Shift+Tab -> anterior (con wrap)
unbind = ALT, Tab
bind = ALT, Tab, workspace, e+1
bind = ALT SHIFT, Tab, workspace, e-1

# Super+Tab tambien cicla entre workspaces
unbind = SUPER, Tab
bind = SUPER, Tab, workspace, e+1
bind = SUPER SHIFT, Tab, workspace, e-1

# Quakboard global hotkey + window rules
source = ~/.config/hypr/quakboard.conf

# Caelestia shell (replaces waybar). Waybar is disabled via the ML4W marker
# file ~/.config/ml4w/settings/waybar-disabled (delete it + Super+Shift+B to
# bring waybar back).
exec-once = caelestia shell -d

# Caelestia drawer hotkeys (Super+Space launcher is set above; session menu is Super+Shift+=)
# Super+D -> dashboard | Super+N -> notifications sidebar
bind = SUPER, D, exec, caelestia shell drawers toggle dashboard
bind = SUPER, N, exec, caelestia shell drawers toggle sidebar

# Disable text-extractor OCR (Super+Alt+A) - was not working (2026-07-05)
unbind = SUPER ALT, A

# Disabled unused ML4W keybinds - these were the last rofi users, so rofi can
# now be uninstalled. Scripts stay on disk, just unbound. (2026-07-05)
# Sidepad (not used):
unbind = SUPER, S
unbind = SUPER SHIFT, S
unbind = SUPER CTRL, right
unbind = SUPER CTRL, left
# ML4W wallpaper selector/random/automation (wallpaper is on Caelestia now):
unbind = SUPER CTRL, W
unbind = SUPER SHIFT, W
unbind = SUPER ALT, W
# ML4W screenshot menu (you use hyprshot on Super+Shift+3/4/5):
unbind = SUPER, PRINT
unbind = SUPER ALT, F
unbind = SUPER ALT, S
# Keybind viewer (not used):
unbind = SUPER CTRL, K
# Waybar controls (waybar uninstalled - these would silently no-op; Super+Ctrl+B
# would also re-trigger the waybar-disable marker). (2026-07-05)
unbind = SUPER SHIFT, B
unbind = SUPER CTRL, B
unbind = SUPER CTRL, T
